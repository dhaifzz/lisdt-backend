services:
  - type: web
    name: lisdt-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build && npm run prisma:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://lisdt.vercel.app
      - key: APP_URL
        value: https://lisdt.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
